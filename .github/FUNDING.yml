# Puts a "Sponsor" button at the top of the repo.
#
# Every line below is commented out on purpose: a funding link pointing at an
# account that doesn't exist yet renders a button that 404s, which is worse than
# no button. Uncomment a line once that account is actually live.
#
# GitHub Sponsors — enrol first at https://github.com/sponsors, which needs
# Stripe KYC, PAN and a bank account before the profile goes live.
# github: [k3shavgupta]

# One-off tips rather than recurring sponsorship. Both pay out to India, but
# through PayPal/Stripe, so check what each does with an Indian account before
# committing to one.
# ko_fi: k3shavgupta
# buy_me_a_coffee: k3shavgupta

# Up to four arbitrary URLs — a personal donate page, UPI link, anything.
# custom: ["https://example.com/donate"]
